<!doctype html><html><head><meta charset="utf-8"><title>Assignment Submission Portal | Roll 26</title><style>body{font-family:Arial;background:#f4f7fb;margin:0;padding:30px}.wrap{max-width:850px;margin:auto}section{background:white;padding:24px;margin:18px 0;border-radius:12px;box-shadow:0 2px 12px #0001}input,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ccc;border-radius:6px}button{background:#147d73;color:white;cursor:pointer;border:0}.error{color:#b00020}.success{color:green}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left;overflow-wrap:anywhere}</style></head><body><div class="wrap"><h1>Assignment Submission Portal — Roll 26</h1><section><h2>Submit Assignment</h2>{% for category,msg in get_flashed_messages(with_categories=true) %}<p class="{{category}}">{{msg}}</p>{% endfor %}<form method="post"><label>Student Name</label><input name="name" placeholder="Student Name"><label>Registration Number</label><input name="registration" placeholder="FA23-BSE-026"><label>Assignment Title</label><input name="title" placeholder="DevOps Lab"><label>Submission URL</label><input name="url" placeholder="https://github.com/..."><button type="submit">Submit Assignment</button></form></section><section><h2>Saved Submissions</h2><table><tr><th>Name</th><th>Registration</th><th>Title</th><th>Link</th></tr>{% for row in rows %}<tr><td>{{row[0]}}</td><td>{{row[1]}}</td><td>{{row[2]}}</td><td><a href="{{row[3]}}" target="_blank" rel="noopener noreferrer">Open</a></td></tr>{% endfor %}</table></section></div></body></html>
