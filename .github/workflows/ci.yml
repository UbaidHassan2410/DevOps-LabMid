name: Test and Report

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: cmd
        run: pip install -r requirements.txt

      - name: Run tests
        shell: cmd
        run: python -m pytest tests/ -v --junitxml=results.xml

      - name: Build JSON report
        if: always()
        shell: cmd
        run: python make_report.py

      - name: Deliver report to computer
        if: always()
        shell: cmd
        run: python receiver.py