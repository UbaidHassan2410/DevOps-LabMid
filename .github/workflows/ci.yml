name: Test and Report

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --junitxml=results.xml

      - name: Build JSON report
        if: always()
        run: python make_report.py

      - name: Deliver report to computer
        if: always()
        run: |
          python -c "import urllib.request; req = urllib.request.Request('http://127.0.0.1:5001/report', data=open('report-output.json', 'rb').read(), headers={'X-Report-Token': 'lab-local-token', 'Content-Type': 'application/json'}, method='POST'); print(urllib.request.urlopen(req).read().decode())"