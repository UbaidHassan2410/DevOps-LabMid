name: Test and Report

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --junitxml=results.xml

      - name: Build JSON report
        if: always()
        run: python make_report.py

      - name: Deliver report to computer
        if: always()
        run: |
          & "curl.exe" -X POST http://127.0.0.1:5001/report -H "X-Report-Token: lab-local-token" -H "Content-Type: application/json" -d "@test-report.json"